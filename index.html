          </div>
          <div class="live" id="int-live"><span class="spinner"></span></div>
        </div></div>

        <div class="step"><span class="stepno">3</span><div class="stepbody">
          <div class="range">
            <div class="row"><label class="lbl" for="variability">Berg vs. Flach (Pacing-Spanne)</label><output id="var-out"></output></div>
            <input type="range" id="variability" data-g="race" data-k="variability" min="0" max="20" step="1" value="${c.variability}">
            <div class="hint" id="var-live"></div>
            <div class="hint">0 % = konstante Leistung. Modelliert sind ±10 % (Atkinson et al. 2007); +5 % bergauf wurden im Labor überwiegend toleriert.</div>
          </div>
        </div></div>

        <details class="more" id="int-help"${S.helpOpen === false ? '' : ' open'}><summary>So stellst du die Intensität ein</summary><div class="explain">
          <p><b>Was du einstellst:</b> wie hart die ganze Fahrt wird. Die App misst das mit der <b>Normalized Power (NP)</b>: einer Leistung, die schwankende Watt so gewichtet, wie sie dich belasten. Wer bergauf mehr und bergab weniger tritt, hat deshalb eine höhere NP als Durchschnittsleistung.</p>
          <p><b>Intensitätsfaktor:</b> IF = NP ÷ FTP. Beispiel: IF 0,80 bei FTP 250 W bedeutet NP 200 W. Deine FTP ist die Leistung, die du ungefähr eine Stunde halten kannst – je länger die Fahrt, desto niedriger muss der IF sein.</p>
          <p><b>Was die App daraus macht:</b> Sie verteilt die Leistung auf die Abschnitte – mehr am Berg, weniger im Flachen und bergab – so, dass die NP der ganzen Fahrt genau dein Ziel trifft. Wie groß der Unterschied sein darf, legst du in Schritt 3 fest.</p>
          <p><b>Drei Wege zum selben Ziel:</b> IF direkt, Ziel-Watt (NP) oder Zielzeit. Bei Watt und Zielzeit rechnet die App den passenden IF aus.</p>
          <p><b>So findest du deinen Wert:</b></p>
          <ol>
            <li>Fahrtart wählen – das setzt einen Startwert innerhalb der typischen Bereiche nach Coggan (Skala oben).</li>
            <li>Mit einer eigenen Fahrt vergleichen: ähnliche Dauer, ähnliches Profil, am Ende noch gut gefahren. Deren NP geteilt durch deine damalige FTP ist ein guter Startwert. NP und IF zeigen z. B. TrainingPeaks und Garmin Connect; Strava zeigt eine ähnliche „gewichtete Durchschnittsleistung“.</li>
            <li>Ergebnis prüfen: Passen die Watt am längsten Anstieg und die Fahrzeit zu dem, was du dir zutraust? Wenn nicht, den IF in kleinen Schritten (0,01–0,02) ändern.</li>
          </ol>
        </div></details>

        <details class="more"><summary>Start, Wetter & Verpflegung</summary><div>
          <div class="fields">
            <div class="field"><label for="startTime">Startzeit</label><div class="inp"><input type="time" id="startTime" data-g="race" data-k="startTime" value="${esc(c.startTime)}"></div></div>
            ${fNum('temp', 'Temperatur', '°C', c.temp, { g: 'race' })}
            ${fNum('windSpeed', 'Wind', 'km/h', c.windSpeed, { g: 'race' })}
            ${fSel('windFrom', 'Wind aus', c.windFrom, WIND.map(([t, d]) => [d, t]), { g: 'race' })}
            ${fNum('vmaxDown', 'Höchstgeschw. bergab', 'km/h', c.vmaxDown, { g: 'race', hint: 'deine Einschätzung (Kurven, Belag)' })}
            ${fSel('carbGph', 'Kohlenhydrate', c.carbGph, [['', 'Empfehlung nach Dauer'], ['0', 'keine'], ['30', '30 g/h'], ['45', '45 g/h'], ['60', '60 g/h'], ['75', '75 g/h'], ['90', '90 g/h']], { g: 'race' })}
            ${fSel('fuelEveryMin', 'Verpflegung alle', c.fuelEveryMin, [['15', '15 min'], ['20', '20 min'], ['30', '30 min']], { g: 'race' })}
          </div>
        </div></details>
      </div>
      <div id="plan-out" class="view"></div>`;
    const v = $('#controls');
    v.addEventListener('input', onField);
    v.addEventListener('change', onField);
    v.addEventListener('input', syncControls);
    $('#int-help').addEventListener('toggle', e => { S.helpOpen = e.target.open; persist(); });
    $$('#type-seg button').forEach(b => b.addEventListener('click', () => {
      S.race.type = b.dataset.type;
      $$('#type-seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      const T = PLAN ? PLAN.summary.T : 3 * 3600;
      S.race.ifTarget = E.suggestIF(S.race.type, T);
      $('#ifTarget').value = S.race.ifTarget;
      if (S.race.intMode === 'np') { S.race.intMode = 'if'; }
      if (S.race.intMode !== 'time') setIntMode(S.race.intMode);
      persist(); syncControls(); schedule();
    }));
    $$('#int-seg button').forEach(b => b.addEventListener('click', () => setIntMode(b.dataset.mode, true)));
    ['ttH', 'ttM'].forEach(id => $('#' + id).addEventListener('change', () => {
      const h = Math.max(0, Math.round(num($('#ttH').value) || 0)), m = Math.max(0, Math.min(59, Math.round(num($('#ttM').value) || 0)));
      S.race.targetTime = (h || m) ? `${h}:${String(m).padStart(2, '0')}` : '';
      persist(); schedule();
    }));
    setIntMode(c.intMode || 'if');
    syncControls();
  }

  function setIntMode(mode, user) {
    const c = S.race, ftp = num(S.rider.ftp) || 250;
    if (user && PLAN) {
      // aktuellen Stand in den neuen Eingabeweg übernehmen
      const iff = PLAN.summary.ifTarget;
      if (mode === 'if') { c.ifTarget = Math.round(iff * 100) / 100; $('#ifTarget').value = c.ifTarget; }
      if (mode === 'np') { c.targetNP = Math.round(iff * ftp); $('#targetNP').value = c.targetNP; }
      if (mode === 'time' && !c.targetTime) {
        const m = Math.round(PLAN.summary.T / 60);
        c.targetTime = `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
        $('#ttH').value = Math.floor(m / 60); $('#ttM').value = m % 60;
      }
    }
    c.intMode = mode;
    $$('#int-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    $$('.intin').forEach(el => { el.hidden = el.dataset.for !== mode; });
    persist();
    if (user) { syncControls(); schedule(); }
  }

  function syncControls() {
    const c = S.race;
    const iff = num(c.ifTarget) || 0.8;
    const pct = (x, a, b) => `${Math.max(0, Math.min(100, (x - a) / (b - a) * 100))}%`;
    $('#if-out').textContent = nf(iff, 2);
    $('#ifTarget').style.setProperty('--p', pct(iff, 0.55, 1.15));
    $('#variability').style.setProperty('--p', pct(num(c.variability) || 0, 0, 20));
    $('#var-out').textContent = `±${nf(num(c.variability) || 0)} %`;
  }

  // Ziel-IF für eine Zielzeit per Bisektion (Fahrzeit sinkt mit steigendem IF)
  function solveIF(route, base, targetSec) {
    const run = iff => E.plan(route, Object.assign({}, base, { ifTarget: iff, fast: true }));
    let lo = 0.45, hi = 1.25;
    const rLo = run(lo);
    if (rLo.summary.T <= targetSec) return { iff: lo, status: 'slow', T: rLo.summary.T };
    const rHi = run(hi);
    if (rHi.summary.T > targetSec) return { iff: rHi.summary.ifTarget, status: 'fast', T: rHi.summary.T, wLimited: rHi.summary.ifTarget < hi - 1e-6 };
    for (let i = 0; i < 10; i++) {
      const m = (lo + hi) / 2;
      if (run(m).summary.T > targetSec) lo = m; else hi = m;
    }
    return { iff: Math.round(hi * 1000) / 1000, status: 'ok' };
  }

  function updateIntensityReadout() {
    const r = PLAN, s = r.summary, c = S.race, ftp = r.params.ftp;
    const ped = r.sections.filter(x => !x.coasting);
    const tw = arr => { let a = 0, t = 0; arr.forEach(x => { a += x.target * x.dur; t += x.dur; }); return t ? a / t : null; };
    const up = tw(ped.filter(x => x.cls === 'up')), fl = tw(ped.filter(x => x.cls === 'flat'));
    const band = bandOf(s.IF);
    const mk = $('#if-marker');
    mk.style.left = `${Math.max(0, Math.min(100, (s.IF - 0.55) / 0.6 * 100))}%`;
    const warn = [];
    const h = s.T / 3600;
    if ((h > 2.5 && s.IF > 0.95) || (h > 1.25 && s.IF > 1.05)) warn.push(`Für ${fmtDur(s.T)} liegt IF ${nf(s.IF, 2)} über den typischen Werten nach Coggan.`);
    if (c.intMode === 'time' && solveInfo) {
      if (solveInfo.status === 'slow') warn.push(`Für diese Zielzeit reicht schon IF 0,45 – wähle eine kürzere Zeit. Angezeigt wird der Plan mit IF ${nf(s.IF, 2)}.`);
      if (solveInfo.status === 'fast') warn.push(`Diese Zielzeit ist mit deinen Werten nicht erreichbar: Selbst mit IF ${nf(solveInfo.iff, 2)} dauert die Fahrt laut Modell ${fmtDur(solveInfo.T)}${solveInfo.wLimited ? " (begrenzt durch deine W'-Reserve)" : ''}. Angezeigt wird der Plan mit IF ${nf(s.IF, 2)}.`);
    }
    if (c.intMode === 'time' && !c.targetTime) warn.push('Trage eine Zielzeit ein.');
    r.adjust.forEach(a => warn.push(a));
    $('#int-live').innerHTML = `
      <div class="livegrid">
        <div><span class="k">IF</span><b>${nf(s.IF, 2)}</b></div>
        <div><span class="k">Ziel-NP</span><b>${nf(s.NP)} W</b><span class="s">${nf(s.IF * 100)} % von FTP ${nf(ftp)} W</span></div>
        <div><span class="k">Fahrzeit</span><b>${fmtDur(s.T)}</b></div>
        <div><span class="k">Anstiege</span><b>${up ? '~' + nf(up) + ' W' : '–'}</b></div>
        <div><span class="k">Flach</span><b>${fl ? '~' + nf(fl) + ' W' : '–'}</b></div>
      </div>
      <p class="small"><b>${esc(band[2])}</b> · Coggan: ${esc(band[3])}.</p>
      ${warn.map(w => `<p class="note warn small">${esc(w)}</p>`).join('')}`;
    if (c.intMode !== 'if') { $('#ifTarget').value = s.ifTarget; syncControls(); }
    $('#var-live').textContent = up && fl ? `Ergebnis: Anstiege ${nf(up)} W (${up >= s.NP ? '+' : '−'}${nf(Math.abs(up / s.NP - 1) * 100)} % zur NP), Flach ${nf(fl)} W (${fl >= s.NP ? '+' : '−'}${nf(Math.abs(fl / s.NP - 1) * 100)} %).` : '';
  }

  /* ------------------------------------------------------ Diagramme */
  function zoneVar(z) { return `var(--z${z})`; }

  function stackedChart(el, r) {
    const route = r.route, sim = r.sim, D = route.D;
    const Wd = Math.max(300, Math.round(el.clientWidth || 640));
    const L = 44, Rm = 10, gap = 26, top = 20;
    const panels = [{ k: 'ele', h: Wd < 500 ? 130 : 170, t: 'Höhe (m) · Fläche = Ziel-Leistungszone' }, { k: 'pow', h: 96, t: 'Ziel-Leistung (W) · gestrichelt FTP' }, { k: 'spd', h: 70, t: 'Geschwindigkeit (km/h)' }];
    if (r.wStep) panels.push({ k: 'wb', h: 70, t: "W'-Bilanz (kJ) · gestrichelt Reserve" });
    let y = top;
    panels.forEach(p => { p.y = y; y += p.h + gap; });
    const H = y - gap + 26;
    const iw = Wd - L - Rm;
    const X = d => L + d / D * iw;
    const step = Math.max(1, Math.floor(route.N / Math.min(900, iw * 1.5)));
    const ticks = (lo, hi, n) => { const span = hi - lo || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))); const st = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || mag * 10; const out = []; for (let t = Math.ceil(lo / st) * st; t <= hi + 1e-9; t += st) out.push(Math.round(t * 100) / 100); return out; };
    let s = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Höhenprofil, Ziel-Leistung, Geschwindigkeit${r.wStep ? " und W'-Bilanz" : ''} über die Strecke">`;
    const sel = S.selected !== null ? r.sections[S.selected] : null;
    panels.forEach(p => {
      s += `<text class="chart-label" x="${L}" y="${p.y - 7}">${esc(p.t)}</text>`;
      if (sel) s += `<rect x="${X(sel.kmStart * 1000)}" y="${p.y}" width="${Math.max(2, X(sel.kmEnd * 1000) - X(sel.kmStart * 1000))}" height="${p.h}" style="fill:var(--accent-soft)"/>`;
      let lo, hi, fmt = v => nf(v);
      if (p.k === 'ele') { lo = Math.floor(route.minEle / 50) * 50; hi = Math.ceil((route.maxEle + (route.maxEle - route.minEle) * 0.12) / 50) * 50; }
      if (p.k === 'pow') { lo = 0; hi = Math.ceil(Math.max(r.params.ftp * 1.1, ...r.sections.map(x => x.target)) / 50) * 50; }
      if (p.k === 'spd') { lo = 0; let mx = 0; for (let i = 0; i < route.N; i++) mx = Math.max(mx, sim.v[i]); hi = Math.ceil(mx * 3.6 / 10) * 10; }
      if (p.k === 'wb') { lo = 0; hi = r.params.wprime / 1000; fmt = v => nf(v, v % 1 ? 1 : 0); }
      p.Y = v => p.y + p.h - (v - lo) / (hi - lo) * p.h;
      ticks(lo, hi, p.k === 'ele' ? 4 : 3).forEach(t => {
        s += `<line x1="${L}" x2="${L + iw}" y1="${p.Y(t)}" y2="${p.Y(t)}" style="stroke:var(--grid)" stroke-width="1"/>`;
        s += `<text class="axis-text" x="${L - 6}" y="${p.Y(t) + 4}" text-anchor="end">${fmt(t)}</text>`;
      });
      if (p.k === 'ele') {
        r.sections.forEach(sc => {
          let d = `M${X(route.x[sc.i0])},${p.y + p.h}`;
          for (let i = sc.i0; i <= sc.i1; i += step) d += `L${X(route.x[i]).toFixed(1)},${p.Y(route.ele[i]).toFixed(1)}`;
          d += `L${X(route.x[sc.i1]).toFixed(1)},${p.Y(route.ele[sc.i1]).toFixed(1)}L${X(route.x[sc.i1]).toFixed(1)},${p.y + p.h}Z`;
          s += `<path d="${d}" style="fill:${sc.coasting ? 'var(--roll)' : zoneVar(sc.zone)}"/>`;
        });
        let d = '';
        for (let i = 0; i < route.N; i += step) d += `${d ? 'L' : 'M'}${X(route.x[i]).toFixed(1)},${p.Y(route.ele[i]).toFixed(1)}`;
        d += `L${X(D).toFixed(1)},${p.Y(route.ele[route.N - 1]).toFixed(1)}`;
        s += `<path d="${d}" style="fill:none;stroke:var(--fg)" stroke-width="1.6" stroke-linejoin="round"/>`;
        r.climbs.forEach(c => { s += `<text class="climb-num" x="${X(c.kmEnd * 1000)}" y="${p.Y(c.eleEnd) - 6}" text-anchor="middle">${c.no}</text>`; });
        r.fuel.markers.forEach(m => { s += `<circle cx="${X(m.km * 1000)}" cy="${p.y + p.h - 5}" r="3.5" style="fill:var(--accent);stroke:var(--glass-strong)" stroke-width="1.5"/>`; });
      }
      if (p.k === 'pow') {
        r.sections.forEach(sc => {
          const x0 = X(sc.kmStart * 1000), x1 = X(sc.kmEnd * 1000), w = Math.max(1, x1 - x0 - 2);
          if (sc.coasting) { s += `<rect x="${x0 + 1}" y="${p.y + p.h - 4}" width="${w}" height="4" rx="2" style="fill:var(--roll)"/>`; return; }
          const yy = p.Y(sc.target), hh = p.y + p.h - yy;
          s += `<path d="M${x0 + 1},${p.y + p.h}V${yy + Math.min(3, hh)}q0,-3 3,-3H${x0 + 1 + w - 3}q3,0 3,3V${p.y + p.h}Z" style="fill:${zoneVar(sc.zone)}"/>`;
        });
        s += `<line x1="${L}" x2="${L + iw}" y1="${p.Y(r.params.ftp)}" y2="${p.Y(r.params.ftp)}" style="stroke:var(--fg)" stroke-width="1.2" stroke-dasharray="5 4"/>`;
        s += `<text class="axis-text" x="${L + iw}" y="${p.Y(r.params.ftp) - 4}" text-anchor="end">FTP ${nf(r.params.ftp)}</text>`;
      }
      if (p.k === 'spd') {
        let d = '';
        for (let i = 0; i < route.N; i += step) d += `${d ? 'L' : 'M'}${X(route.x[i]).toFixed(1)},${p.Y(sim.v[i] * 3.6).toFixed(1)}`;
        s += `<path d="${d}" style="fill:none;stroke:var(--fg2)" stroke-width="1.6" stroke-linejoin="round"/>`;
      }
      if (p.k === 'wb') {
        let d = '';
        for (let i = 0; i < route.N; i += step) d += `${d ? 'L' : 'M'}${X(route.x[i]).toFixed(1)},${p.Y(r.wStep[i] / 1000).toFixed(1)}`;
        s += `<path d="${d}" style="fill:none;stroke:var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
        const rv = r.params.wprime * r.params.wReserve / 1000;
        s += `<line x1="${L}" x2="${L + iw}" y1="${p.Y(rv)}" y2="${p.Y(rv)}" style="stroke:var(--fg2)" stroke-width="1.2" stroke-dasharray="5 4"/>`;
      }
    });
    const last = panels[panels.length - 1];
    ticks(0, D / 1000, Wd < 500 ? 5 : 10).forEach(k => { s += `<text class="axis-text" x="${X(k * 1000)}" y="${last.y + last.h + 16}" text-anchor="middle">${nf(k)}</text>`; });
    s += `<text class="axis-text" x="${L + iw}" y="${last.y + last.h + 30}" text-anchor="end">km</text>`;
    s += `<line id="xh" x1="0" x2="0" y1="${top - 4}" y2="${last.y + last.h}" style="stroke:var(--fg)" stroke-width="1" visibility="hidden"/>`;
    panels.forEach(p => { s += `<circle class="xh-dot" data-k="${p.k}" r="4" cx="0" cy="0" style="fill:var(--glass-strong);stroke:var(--fg)" stroke-width="1.5" visibility="hidden"/>`; });
    s += `<rect x="${L}" y="${top - 4}" width="${iw}" height="${last.y + last.h - top + 4}" fill="transparent" id="hit"/>`;
    s += '</svg>';
    el.innerHTML = s + '<div class="tip" id="tip" hidden></div>';
    // Interaktion
    const svg = el.querySelector('svg'), tip = el.querySelector('#tip'), xh = el.querySelector('#xh');
    const show = ev => {
      const rect = svg.getBoundingClientRect();
      const sx = (ev.clientX - rect.left) * (Wd / rect.width);
      const d = Math.max(0, Math.min(D, (sx - L) / iw * D));
      const i = Math.min(route.N - 1, Math.round(d / E.STEP));
      const xs = X(route.x[i]);
      xh.setAttribute('x1', xs); xh.setAttribute('x2', xs); xh.setAttribute('visibility', 'visible');
      const sc = r.sections[route.secOfStep[Math.min(i, route.N - 2)]];
      panels.forEach(p => {
        const dot = svg.querySelector(`.xh-dot[data-k="${p.k}"]`);
        const v = p.k === 'ele' ? route.ele[i] : p.k === 'pow' ? (sc.coasting ? 0 : sc.target) : p.k === 'spd' ? sim.v[i] * 3.6 : r.wStep[i] / 1000;
        dot.setAttribute('cx', xs); dot.setAttribute('cy', p.Y(v)); dot.setAttribute('visibility', 'visible');
      });
      const g = route.grade[Math.min(i, route.N - 2)] * 100;
      tip.innerHTML = `<b>km ${nf(route.x[i] / 1000, 1)}</b>
        <div class="tr"><span>Höhe</span><span>${nf(route.ele[i])} m</span></div>
        <div class="tr"><span>Steigung</span><span>${nf(g, 1)} %</span></div>
        <div class="tr"><span>Ziel</span><span>${sc.coasting ? 'rollen' : `${sc.target} W · Z${sc.zone}`}</span></div>
        <div class="tr"><span>Tempo</span><span>${nf(sim.v[i] * 3.6, 1)} km/h</span></div>
        <div class="tr"><span>Fahrzeit</span><span>${fmtDur(sim.t[i])}</span></div>
        ${r.wStep ? `<div class="tr"><span>W'</span><span>${nf(r.wStep[i] / 1000, 1)} kJ</span></div>` : ''}`;
      tip.hidden = false;
      const px = xs / Wd * rect.width;
      const tw = tip.offsetWidth;
      tip.style.left = (px + 14 + tw > rect.width ? px - tw - 14 : px + 14) + 'px';
      tip.style.top = '24px';
    };
    const hide = () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); svg.querySelectorAll('.xh-dot').forEach(d => d.setAttribute('visibility', 'hidden')); };
    svg.addEventListener('pointermove', show);
    svg.addEventListener('pointerdown', show);
    svg.addEventListener('pointerleave', hide);
    svg.addEventListener('pointercancel', hide);
  }

  function outlineSVG(r, W, H) {
    const route = r.route;
    const lat0 = route.lat[0], k = Math.cos(lat0 * Math.PI / 180);
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    const P = [];
    const step = Math.max(1, Math.floor(route.N / 700));
    for (let i = 0; i < route.N; i += step) {
      const x = route.lon[i] * k, y = -route.lat[i];
      P.push([i, x, y]);
      minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    }
    const pad = 14, sc = Math.min((W - 2 * pad) / (maxX - minX || 1), (H - 2 * pad) / (maxY - minY || 1));
    const ox = (W - (maxX - minX) * sc) / 2, oy = (H - (maxY - minY) * sc) / 2;
    const px = x => (ox + (x - minX) * sc).toFixed(1), py = y => (oy + (y - minY) * sc).toFixed(1);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Streckenverlauf, eingefärbt nach Ziel-Leistungszone">`;
    let all = '';
    P.forEach(([, x, y], j) => { all += `${j ? 'L' : 'M'}${px(x)},${py(y)}`; });
    s += `<path d="${all}" style="fill:none;stroke:var(--glass-strong)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`;
    r.sections.forEach(scn => {
      let d = '';
      P.filter(p => p[0] >= scn.i0 - step && p[0] <= scn.i1 + step).forEach(([, x, y], j) => { d += `${j ? 'L' : 'M'}${px(x)},${py(y)}`; });
      s += `<path d="${d}" style="fill:none;stroke:${scn.coasting ? 'var(--roll)' : zoneVar(scn.zone)}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
    });
    const a = P[0], b = P[P.length - 1];
    s += `<circle cx="${px(a[1])}" cy="${py(a[2])}" r="6" style="fill:var(--accent);stroke:var(--glass-strong)" stroke-width="2.5"/>`;
    s += `<rect x="${+px(b[1]) - 4.5}" y="${+py(b[2]) - 4.5}" width="9" height="9" style="fill:var(--fg);stroke:var(--glass-strong)" stroke-width="2"/>`;
    return s + '</svg>';
  }

  function climbSpark(r, c) {
    const route = r.route, W = 260, H = 54;
    let mn = Infinity, mx = -Infinity;
    for (let i = c.i0; i <= c.i1; i++) { mn = Math.min(mn, route.ele[i]); mx = Math.max(mx, route.ele[i]); }
    const X = i => (route.x[i] - route.x[c.i0]) / (route.x[c.i1] - route.x[c.i0]) * W, Y = e => H - 3 - (e - mn) / ((mx - mn) || 1) * (H - 8);
    let d = `M0,${H}`;
    const st = Math.max(1, Math.floor((c.i1 - c.i0) / 120));
    for (let i = c.i0; i <= c.i1; i += st) d += `L${X(i).toFixed(1)},${Y(route.ele[i]).toFixed(1)}`;
    d += `L${W},${Y(route.ele[c.i1]).toFixed(1)}L${W},${H}Z`;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" style="fill:${zoneVar(c.zone)}"/></svg>`;
  }

  async function loadFile(f) {
    try {
      const text = await f.text();
      const parsed = E.parseGPX(text);
      if (!parsed.name || parsed.name === 'Strecke') parsed.name = f.name.replace(/\.gpx$/i, '');
      E.buildRoute(parsed); // prüft die Strecke
      const id = 'r' + Date.now().toString(36);
      S.routes.unshift({ id, name: parsed.name, pts: compactPts(parsed), added: Date.now() });
      S.activeId = id; S.selected = null;
      if (!persist()) { S.routes.shift(); }
      routeCache = { id: null };
      recompute();
      toast(`„${parsed.name}“ geladen`);
    } catch (err) {
      toast(err.message || 'Die Datei konnte nicht gelesen werden.');
    }
  }

  /* --------------------------------------------------- Export */
  class CanvasPainter {
    constructor(ctx, k) { this.c = ctx; this.k = k; }
    fill(c) { this.c.fillStyle = c; return this; }
    stroke(c) { this.c.strokeStyle = c; return this; }
    lw(mm) { this.c.lineWidth = Math.max(0.6, mm * this.k); return this; }
    dash(on, off) { this.c.setLineDash(on ? [on * this.k, (off || on) * this.k] : []); return this; }
    alpha(a) { this.c.globalAlpha = a; return this; }
    save() { this.c.save(); return this; }
    restore() { this.c.restore(); return this; }
    lineCap(n) { this.c.lineCap = ['butt', 'round', 'square'][n] || 'butt'; return this; }
    lineJoin(n) { this.c.lineJoin = ['miter', 'round', 'bevel'][n] || 'miter'; return this; }
    _end(mode) { if (mode === 'S') this.c.stroke(); else { this.c.fill(); if (mode === 'B') this.c.stroke(); } }
    rect(x, y, w, h, mode) { const k = this.k; this.c.beginPath(); this.c.rect(x * k, y * k, w * k, h * k); this._end(mode); return this; }
    roundRect(x, y, w, h, r, mode) { const k = this.k; this.c.beginPath(); if (this.c.roundRect) this.c.roundRect(x * k, y * k, w * k, h * k, r * k); else this.c.rect(x * k, y * k, w * k, h * k); this._end(mode); return this; }
    line(x1, y1, x2, y2) { const k = this.k; this.c.beginPath(); this.c.moveTo(x1 * k, y1 * k); this.c.lineTo(x2 * k, y2 * k); this.c.stroke(); return this; }
    poly(pts, close, mode) { const k = this.k; this.c.beginPath(); pts.forEach((p, i) => i ? this.c.lineTo(p[0] * k, p[1] * k) : this.c.moveTo(p[0] * k, p[1] * k)); if (close) this.c.closePath(); this._end(mode === 'f' ? 'f' : mode === 'B' ? 'B' : 'S'); return this; }
    circle(cx, cy, r, mode) { const k = this.k; this.c.beginPath(); this.c.arc(cx * k, cy * k, r * k, 0, Math.PI * 2); this._end(mode); return this; }
    clipRect(x, y, w, h) { const k = this.k; this.c.beginPath(); this.c.rect(x * k, y * k, w * k, h * k); this.c.clip(); return this; }
    text(str, x, y, o) {
      o = o || {};
      const size = o.size || 9, bold = !!o.bold;
      let s = String(str);
      if (o.maxW && PL.widthOf(s, size, bold) > o.maxW) { while (s.length > 1 && PL.widthOf(s + '…', size, bold) > o.maxW) s = s.slice(0, -1); s += '…'; }
      const w = PL.widthOf(s, size, bold);
      let xx = x; if (o.align === 'right') xx = x - w; else if (o.align === 'center') xx = x - w / 2;
      if (o.color) this.c.fillStyle = o.color;
      this.c.font = `${bold ? 700 : 400} ${size * 0.3528 * this.k}px Helvetica, Arial, sans-serif`;
      this.c.textBaseline = 'alphabetic';
      this.c.fillText(s, xx * this.k, y * this.k);
      return w;
    }
    para(str, x, y, width, o) { o = o || {}; const size = o.size || 9, lh = o.lh || size * 0.42; const lines = PL.wrap(str, width, size, !!o.bold); lines.forEach((ln, i) => this.text(ln, x, y + i * lh, o)); return y + lines.length * lh; }
  }

  function stickerOpts() {
    const st = S.sticker;
    return {
      w: st.w, h: st.h, copies: st.copies, mode: st.mode, minGain: +st.minGain, lines: +st.lines,
      round5: !!st.round5, profile: st.profile !== false, autoFont: st.autoFont !== false,
      picks: st.picks[S.activeId] || null,
    };
  }

  function onSticker(e) {
    const el = e.target, st = S.sticker;
    if (el.id === 'stFmt') { st.fmt = el.value; const f = STICKERS[st.fmt]; if (f[1]) { st.w = f[1]; st.h = f[2]; $('#stW').value = st.w; $('#stH').value = st.h; } }
    if (el.id === 'stW' || el.id === 'stH') { const v = num(el.value); if (v) { st[el.id === 'stW' ? 'w' : 'h'] = Math.max(el.id === 'stW' ? 22 : 60, Math.min(el.id === 'stW' ? 90 : 260, v)); st.fmt = 'custom'; $('#stFmt').value = 'custom'; } }
    if (el.id === 'stCopies') st.copies = +el.value;
    if (el.id === 'stMinGain') st.minGain = +el.value;
    if (el.id === 'stLines') st.lines = +el.value;
    if (el.id === 'stProfile') st.profile = el.checked;
    if (el.id === 'stRound5') st.round5 = el.checked;
    if (el.id === 'stAutoFont') st.autoFont = el.checked;
    if (el.dataset && el.dataset.key !== undefined) {
      const set = new Set(st.picks[S.activeId] || []);
      if (el.checked) set.add(+el.dataset.key); else set.delete(+el.dataset.key);
      st.picks[S.activeId] = Array.from(set).sort((a, b) => a - b);
    }
    persist();
    if (e.type === 'change' || el.tagName === 'SELECT' || el.type === 'checkbox') renderExport();
  }

  function renderExport() {
    if (!PLAN) return;
    const st = S.sticker, o = stickerOpts();
    if (st.mode === 'custom' && !st.picks[S.activeId]) { st.picks[S.activeId] = R.compactKeys(PLAN, st.w, st.h, o); o.picks = st.picks[S.activeId]; }
    const lay = R.stickerLayout(PLAN, st.w, st.h, o);
    $$('#st-mode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === st.mode)));
    $('#st-mode-hint').textContent = ST_HINT[st.mode];
    $('#st-gain-wrap').hidden = st.mode !== 'compact';
    // Platzanzeige
    const n = lay.rows.length, cap = lay.capacity;
    let msg, cls = '';
    if (st.mode === 'all') msg = `${n} Zeilen · ${lay.parts.length} Zettel`;
    else if (lay.parts.length > 1) { msg = `${n} Zeilen ausgewählt, Platz für ${cap} – das ergibt ${lay.parts.length} Zettel. Wähle Zeilen ab oder nimm „Kurz“ bzw. ohne Profil.`; cls = 'warn'; }
    else msg = `Passt auf 1 Zettel · ${n} von max. ${cap} Zeilen${lay.fontScale > 1.01 ? ` · Schrift +${nf((lay.fontScale - 1) * 100)} %` : ''}`;
    if (lay.dropped.length) msg += ` · ${lay.dropped.length} kürzere Abschnitt${lay.dropped.length > 1 ? 'e' : ''} (km ${lay.dropped.map(x => nf(x.kmStart, 0)).join(', ')}) über die Grundwerte`;
    const fill = st.mode === 'all' ? 100 : Math.min(100, n / Math.max(1, cap) * 100);
    $('#st-fit').className = 'fit ' + cls;
    $('#st-fit').innerHTML = `<div class="fitbar"><i style="width:${fill}%"></i></div><span>${esc(msg)}</span>`;
    // Auswahlliste
    $('#st-picks-wrap').hidden = st.mode !== 'custom';
    if (st.mode === 'custom') {
      const set = new Set(st.picks[S.activeId] || []);
      $('#st-picks').innerHTML = lay.all.map(x => `<label class="pick${set.has(x.key) ? ' on' : ''}">
        <input type="checkbox" data-key="${x.key}"${set.has(x.key) ? ' checked' : ''}>
        <span class="tri ${x.cls}"></span>
        <span class="pt"><b>km ${nf(x.kmStart, 1)}</b> ${x.cls === 'up' ? `Anstieg${x.climbNo ? ' ' + x.climbNo : ''} · ${nf(x.len / 1000, 1)} km · ${nf(x.gain)} Hm` : x.cls === 'down' ? `Abfahrt · ${nf(x.len / 1000, 1)} km` : `Flach · ${nf(x.len / 1000, 1)} km`}</span>
        <span class="pw">${x.roll ? 'rollen' : `${x.target} W`}</span></label>`).join('');
    }
    $('#st-info').textContent = `${st.w} × ${st.h} mm · ${lay.parts.length} Zettel`;
    // Vorschau
    const box = $('#st-prev');
    box.innerHTML = '';
    const k = Math.max(3, Math.min(5.2, 520 / st.h)), dpr = Math.min(3, window.devicePixelRatio || 1);
    lay.parts.forEach((_, i) => {
      const cv = document.createElement('canvas');
      cv.width = Math.round(st.w * k * dpr); cv.height = Math.round(st.h * k * dpr);
      cv.style.width = (st.w * k) + 'px'; cv.style.height = (st.h * k) + 'px';
      cv.setAttribute('aria-label', `Vorschau Zettel Teil ${i + 1}`);
      const p = new CanvasPainter(cv.getContext('2d'), k * dpr);
      R.drawSticker(p, PLAN, lay, i, 0, 0, st.w, st.h);
      box.appendChild(cv);
    });
  }

  function fileName(kind) {
    const base = (PLAN.route.name || 'Strecke').replace(/[^\wäöüÄÖÜß\- ]+/g, '').trim().replace(/\s+/g, '_').slice(0, 40) || 'Strecke';
    return `${kind}_${base}.pdf`;
  }

  // In Claude (Artifact) läuft das Speichern über die Downloads-Funktion des Viewers
  let dlPromise = null;
  function getDownloads() {
    if (!window.claude || typeof window.claude.use !== 'function') return Promise.resolve(null);
    if (!dlPromise) dlPromise = Promise.resolve(window.claude.use('downloads')).catch(() => null);
    return dlPromise;
  }
  function deliver(bytes, name) {
    const blob = new Blob([bytes], { type: 'application/pdf' });
    if (inFrame) {
      getDownloads().then(dl => {
        if (!dl) { const n = $('#dl-note'); if (n) n.hidden = false; toast('Speichern ist in dieser Ansicht nicht möglich.'); return; }
        dl.save({ filename: name, data: blob }).then(() => toast(`${name} gespeichert`)).catch(err => {
          const c = err && err.code;
          if (c === 'declined') return;
          if (c === 'rate_limited') { toast('Bitte kurz warten und erneut tippen.'); return; }
          const n = $('#dl-note'); if (n) n.hidden = false;
          toast('Speichern ist in dieser Ansicht nicht möglich.');
        });
      });
      return;
    }
    let file = null;
    try { file = new File([blob], name, { type: 'application/pdf' }); } catch (e) { /* ältere Browser */ }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).then(() => toast('PDF erstellt')).catch(err => {
        if (err && err.name === 'AbortError') return;
        download(blob, name);
      });
      return;
    }
    download(blob, name);
  }
  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast(`${name} erstellt`);
  }

  /* --------------------------------------------------- Methodik */
  function buildMethodView() {
    $('#v-method').innerHTML = `
      <div class="glass card method">
        ${R.METHOD.map(([k, t]) => `<div><h3>${esc(k)}</h3><p>${esc(t)}</p></div>`).join('')}
        <div><h3>Deine Daten</h3><p>Alles wird auf diesem Gerät berechnet und gespeichert. Es gibt kein Konto, und deine Eingaben und Strecken werden nicht übertragen. Beim Start lädt die App lediglich Schriftarten von Google Fonts; nach der Installation funktioniert sie auch ohne Internet.</p></div>
      </div>
      <div class="glass card"><h2 class="card-h">Quellen</h2><ol class="sources">${R.SOURCES.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>`;
  }

  /* --------------------------------------------- Hintergrund */
  function terrain() {
    const cv = document.getElementById('terrain');
    if (!cv) return;
    const draw = () => {
      const dpr = Math.min(2, window.devicePixelRatio || 1), W = window.innerWidth, H = window.innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      const ctx = cv.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      const col = getComputedStyle(document.documentElement).getPropertyValue('--contour').trim() || 'rgba(0,0,0,.1)';
      const cell = 14, nx = Math.ceil(W / cell) + 1, ny = Math.ceil(H / cell) + 1;
      let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
      const bumps = Array.from({ length: 9 }, () => [rnd() * W, rnd() * H, 120 + rnd() * 260, (rnd() - 0.35) * 2]);
      const f = new Float32Array(nx * ny);
      for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
        const x = i * cell, y = j * cell;
        let v = 0.25 * Math.sin(x / 260) * Math.cos(y / 310);
        for (const [bx, by, r, a] of bumps) v += a * Math.exp(-((x - bx) ** 2 + (y - by) ** 2) / (2 * r * r));
        f[j * nx + i] = v;
      }
      ctx.strokeStyle = col; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let lv = -1.2; lv <= 2; lv += 0.12) {
        for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
          const a = f[j * nx + i], b = f[j * nx + i + 1], c = f[(j + 1) * nx + i + 1], d = f[(j + 1) * nx + i];
          const idx = (a > lv) | ((b > lv) << 1) | ((c > lv) << 2) | ((d > lv) << 3);
          if (idx === 0 || idx === 15) continue;
          const x = i * cell, y = j * cell, t = (p, q) => (lv - p) / (q - p);
          const T = [x + t(a, b) * cell, y], Rr = [x + cell, y + t(b, c) * cell], B = [x + t(d, c) * cell, y + cell], Lf = [x, y + t(a, d) * cell];
          const seg = (p, q) => { ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); };
          switch (idx) {
            case 1: case 14: seg(Lf, T); break; case 2: case 13: seg(T, Rr); break; case 3: case 12: seg(Lf, Rr); break;
            case 4: case 11: seg(Rr, B); break; case 6: case 9: seg(T, B); break; case 7: case 8: seg(Lf, B); break;
            case 5: seg(Lf, T); seg(Rr, B); break; case 10: seg(T, Rr); seg(Lf, B); break;
          }
        }
      }
      ctx.stroke();
    };
    let rt = null;
    window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { draw(); if (PLAN) { if (S.tab === 'plan') stackedChart($('#chart'), PLAN); if (S.tab === 'route') renderRoute(); } }, 200); });
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
    new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    draw();
  }

  /* --------------------------------------------------- Start */
  function renderAll() {
    renderHeader();
    if (S.tab !== 'plan') { try { updateIntensityReadout(); } catch (e) { /* Ansicht noch nicht sichtbar */ } }
    if (S.tab === 'plan') renderPlan();
    else if (S.tab === 'route') renderRoute();
    else if (S.tab === 'export') renderExport();
  }

  function start() {
    if (inFrame) getDownloads().then(dl => { if (!dl) { const n = $('#dl-note'); if (n) n.hidden = false; } });
    shell();
    terrain();
    recompute();
    if (window.__PWA__ && 'serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(() => { /* offline-Cache optional */ });
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
